<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" style="background:#f0f4f8;font-family:Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="760" fill="#EFF6FF" rx="12"/>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a5f">User Management Web API</text>

  <!-- ── ROW 1: CLIENTS ── -->
  <!-- Web App -->
  <rect x="44" y="60" width="120" height="56" rx="8" fill="#DBEAFE" stroke="#378ADD" stroke-width="1"/>
  <text x="104" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Web App</text>
  <text x="104" y="102" text-anchor="middle" font-size="11" fill="#3B82F6">Browser client</text>

  <!-- Mobile App -->
  <rect x="280" y="60" width="120" height="56" rx="8" fill="#DBEAFE" stroke="#378ADD" stroke-width="1"/>
  <text x="340" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Mobile App</text>
  <text x="340" y="102" text-anchor="middle" font-size="11" fill="#3B82F6">iOS / Android</text>

  <!-- 3rd Party -->
  <rect x="516" y="60" width="120" height="56" rx="8" fill="#DBEAFE" stroke="#378ADD" stroke-width="1"/>
  <text x="576" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">3rd-party</text>
  <text x="576" y="102" text-anchor="middle" font-size="11" fill="#3B82F6">External services</text>

  <!-- Arrows clients → gateway -->
  <line x1="104" y1="116" x2="104" y2="154" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="116" x2="340" y2="154" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="576" y1="116" x2="576" y2="154" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="104" y1="162" x2="278" y2="162" stroke="#378ADD" stroke-width="1" opacity="0.4"/>
  <line x1="402" y1="162" x2="576" y2="162" stroke="#378ADD" stroke-width="1" opacity="0.4"/>

  <!-- ── ROW 2: API GATEWAY ── -->
  <rect x="180" y="162" width="320" height="56" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
  <text x="340" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#0F6E56">API Gateway</text>
  <text x="340" y="203" text-anchor="middle" font-size="11" fill="#0F766E">Rate limiting · TLS · Request routing</text>

  <!-- Arrows gateway → services -->
  <line x1="260" y1="218" x2="180" y2="268" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="218" x2="340" y2="268" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="218" x2="500" y2="268" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── ROW 3: CORE SERVICES ── -->
  <!-- Auth Service -->
  <rect x="44" y="268" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="119" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Auth Service</text>
  <text x="119" y="309" text-anchor="middle" font-size="11" fill="#B45309">JWT · OAuth2</text>
  <text x="119" y="325" text-anchor="middle" font-size="11" fill="#B45309">Token validation</text>

  <!-- User Service -->
  <rect x="240" y="268" width="200" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="340" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#3730A3">User Service</text>
  <text x="340" y="309" text-anchor="middle" font-size="11" fill="#5B21B6">Register · Login · Profile</text>
  <text x="340" y="325" text-anchor="middle" font-size="11" fill="#5B21B6">Password reset · Verify</text>

  <!-- RBAC -->
  <rect x="486" y="268" width="150" height="70" rx="8" fill="#FFE4E6" stroke="#BE123C" stroke-width="1"/>
  <text x="561" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#881337">RBAC</text>
  <text x="561" y="309" text-anchor="middle" font-size="11" fill="#BE123C">Roles · Permissions</text>
  <text x="561" y="325" text-anchor="middle" font-size="11" fill="#BE123C">Policy enforcement</text>

  <!-- Arrows services → data -->
  <line x1="119" y1="338" x2="119" y2="418" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="338" x2="220" y2="418" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="338" x2="460" y2="418" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="561" y1="338" x2="561" y2="418" stroke="#BE123C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── ROW 4: DATA LAYER ── -->
  <!-- Token Store -->
  <rect x="44" y="418" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="119" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Token Store</text>
  <text x="119" y="459" text-anchor="middle" font-size="11" fill="#B45309">Redis cache</text>
  <text x="119" y="475" text-anchor="middle" font-size="11" fill="#B45309">Refresh tokens</text>

  <!-- User Database -->
  <rect x="240" y="418" width="200" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="340" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#3730A3">User Database</text>
  <text x="340" y="459" text-anchor="middle" font-size="11" fill="#5B21B6">SQL Server / PostgreSQL</text>
  <text x="340" y="475" text-anchor="middle" font-size="11" fill="#5B21B6">Users · Roles · Profiles</text>

  <!-- Audit Log -->
  <rect x="486" y="418" width="150" height="70" rx="8" fill="#FFE4E6" stroke="#BE123C" stroke-width="1"/>
  <text x="561" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#881337">Audit Log</text>
  <text x="561" y="459" text-anchor="middle" font-size="11" fill="#BE123C">Serilog events</text>
  <text x="561" y="475" text-anchor="middle" font-size="11" fill="#BE123C">Access history</text>

  <!-- Arrows data → cloud -->
  <line x1="119" y1="488" x2="180" y2="558" stroke="#D97706" stroke-width="1.2" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="340" y1="488" x2="340" y2="558" stroke="#7C3AED" stroke-width="1.2" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="561" y1="488" x2="500" y2="558" stroke="#BE123C" stroke-width="1.2" opacity="0.7" marker-end="url(#arrow)"/>

  <!-- ── ROW 5: CLOUD ── -->
  <rect x="160" y="558" width="360" height="56" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
  <text x="340" y="581" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Cloud Infrastructure</text>
  <text x="340" y="599" text-anchor="middle" font-size="11" fill="#64748B">Azure / AWS · CI/CD · Monitoring · CDN</text>

  <!-- ── ENDPOINTS PANEL ── -->
  <rect x="44" y="632" width="592" height="108" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="652" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">REST Endpoints</text>

  <!-- Pill row 1 -->
  <rect x="58" y="660" width="130" height="24" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
  <text x="123" y="676" text-anchor="middle" font-size="10.5" fill="#14532D">POST /auth/register</text>

  <rect x="198" y="660" width="110" height="24" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
  <text x="253" y="676" text-anchor="middle" font-size="10.5" fill="#14532D">POST /auth/login</text>

  <rect x="318" y="660" width="110" height="24" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.8"/>
  <text x="373" y="676" text-anchor="middle" font-size="10.5" fill="#1e40af">GET /users/{id}</text>

  <rect x="438" y="660" width="110" height="24" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
  <text x="493" y="676" text-anchor="middle" font-size="10.5" fill="#92400E">PUT /users/{id}</text>

  <!-- Pill row 2 -->
  <rect x="58" y="692" width="124" height="24" rx="12" fill="#FFE4E6" stroke="#BE123C" stroke-width="0.8"/>
  <text x="120" y="708" text-anchor="middle" font-size="10.5" fill="#881337">DELETE /users/{id}</text>

  <rect x="192" y="692" width="124" height="24" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="254" y="708" text-anchor="middle" font-size="10.5" fill="#3730A3">GET /users/roles</text>

  <rect x="326" y="692" width="124" height="24" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="0.8"/>
  <text x="388" y="708" text-anchor="middle" font-size="10.5" fill="#0F6E56">POST /auth/refresh</text>

  <rect x="460" y="692" width="164" height="24" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="0.8"/>
  <text x="542" y="708" text-anchor="middle" font-size="10.5" fill="#334155">GET /users?page=1</text>

  <!-- Footer -->
  <text x="340" y="748" text-anchor="middle" font-size="10" fill="#94A3B8">.NET Web API · ASP.NET Core · Entity Framework · Serilog · JWT</text>
</svg>
